# Sürüm: main'e her push'ta Android APK'sını ve tek dosyalık Windows exe'sini derler,
# GitHub Releases'a yeni bir sürüm olarak koyar (README'deki kurulum adımları buradan indirir).
name: Sürüm

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['**.xaml', '**.cs', 'Assets/**', 'Mobile/**', 'FlowState.csproj', '.github/workflows/release.yml']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: MAUI Android iş yükü
        run: dotnet workload install maui-android
      - name: APK derle
        run: dotnet publish Mobile/FlowState.Mobile.csproj -f net9.0-android -c Release -o out-apk -p:AndroidSdkDirectory="$ANDROID_HOME"
      - name: APK'yı adlandır
        run: |
          apk=$(ls out-apk/*-Signed.apk | head -1)
          cp "$apk" FlowState.apk
          ls -la FlowState.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: FlowState.apk

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Tek dosyalık exe derle
        run: dotnet publish FlowState.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out-win
      - name: Exe'yi adlandır
        shell: pwsh
        run: Copy-Item out-win\FlowState.exe FlowState-Windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: FlowState-Windows.exe

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.${{ github.run_number }}
          name: Flow State 1.3.${{ github.run_number }} - Güneş Saat
          make_latest: true
          body: |
            **Android:** `FlowState.apk` dosyasını telefona indirip kur (ilk kurulumda "bilinmeyen kaynaklardan yüklemeye izin ver").
            **Windows:** `FlowState-Windows.exe` dosyasını indirip çift tıkla; .NET kurulumu gerekmez.

            Kaynak: ${{ github.sha }}
          files: |
            dist/FlowState.apk
            dist/FlowState-Windows.exe
