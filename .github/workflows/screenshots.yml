# Tasarım önizlemesi: uygulamayı Windows'ta ekran görüntüsü modunda (FLOWSTATE_SHOTS) çalıştırır,
# örnek veriyle her sayfanın PNG'sini alır ve "tasarim-ekran-goruntuleri" dalına yükler.
name: Ekran görüntüleri

on:
  workflow_dispatch:
  push:
    branches: [claude/tasarim-yenileme]
    paths: ['**.xaml', '**.cs', 'Assets/**', 'FlowState.csproj', '.github/workflows/screenshots.yml']

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  shots:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Derle
        run: dotnet build FlowState.csproj -c Release -o out
      - name: Ekran görüntülerini al
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $env:FLOWSTATE_SHOTS = "$PWD\shots"
          $p = Start-Process -FilePath "out\FlowState.exe" -PassThru
          if (-not $p.WaitForExit(240000)) { Stop-Process -Id $p.Id -Force; "zaman aşımı" | Out-File shots\hata.txt -Append }
          Get-ChildItem shots | Format-Table Name, Length
      - name: Görüntüleri dala yükle
        shell: pwsh
        run: |
          $sha = git rev-parse --short HEAD
          $src = "${{ github.ref_name }}"
          Set-Location shots
          git init -q -b tasarim-ekran-goruntuleri
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          "Kaynak: $src @ $sha" | Out-File -Encoding utf8 KAYNAK.txt
          git add -A
          git commit -q -m "Ekran görüntüleri: $src @ $sha"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tasarim-ekran-goruntuleri
